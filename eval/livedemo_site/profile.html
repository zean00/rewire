<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Newsletter preferences — Aurora Books</title>
<style>
  :root { font-family: system-ui, sans-serif; }
  body { margin: 0; color: #1c2430; background: #faf9f7; }
  header { background: #22304a; color: #fff; padding: 14px 28px; display: flex; align-items: center; gap: 40px; }
  header .brand { font-weight: 700; font-size: 1.15rem; }
  nav { display: flex; gap: 22px; }
  nav a { color: #dfe6f2; text-decoration: none; font-size: .95rem; }
  nav a:hover { color: #fff; text-decoration: underline; }
  main { max-width: 640px; margin: 0 auto; padding: 28px 20px 60px; }
  h1 { font-size: 1.55rem; margin: 0 0 6px; }
  .sub { color: #5a6070; margin-bottom: 24px; }
  form { background: #fff; border: 1px solid #e4e0d8; border-radius: 10px; padding: 24px 26px; }
  .field { margin-bottom: 18px; }
  label { display: block; font-weight: 600; font-size: .93rem; margin-bottom: 6px; }
  .hint { font-weight: 400; color: #6b7280; }
  input[type=text], input[type=email], input[type=tel], select {
    width: 100%; box-sizing: border-box; padding: 10px 12px; border: 1px solid #cfcabd;
    border-radius: 8px; font-size: .95rem; background: #fff; color: inherit;
  }
  .btn { background: #2c5aa0; border: none; color: #fff; padding: 11px 22px; border-radius: 8px; font-size: .98rem; cursor: pointer; }
  .btn:hover { background: #24497f; }
  .note { background: #eaf4ec; border: 1px solid #bcd9c3; border-radius: 8px; padding: 12px 16px; margin-top: 16px; color: #21502c; }
  footer { border-top: 1px solid #e4e0d8; padding: 18px 28px; display: flex; gap: 24px; color: #6b7280; font-size: .9rem; }
  footer a { color: #4b5563; }
</style>
</head>
<body>
<header>
  <div class="brand">Aurora Books</div>
  <nav>
    <a href="index.html" data-bid="b405">New Arrivals</a>
    <a href="index.html" data-bid="b406">Bestsellers</a>
    <a href="loyalty.html" data-bid="b407">Loyalty Rewards</a>
    <a href="index.html" data-bid="b408">Gift Cards</a>
    <a href="index.html" data-bid="b409">Contact</a>
  </nav>
</header>
<main>
  <h1>Newsletter preferences</h1>
  <div class="sub">One email at most per day, and only what you ask for.</div>
  <form id="prefs" onsubmit="event.preventDefault(); document.getElementById('saved-note').hidden=false;">
    <div class="field">
      <label>Full name
        <input type="text" data-bid="b410" aria-label="Full name" placeholder="Ada Lovelace" autocomplete="name">
      </label>
    </div>
    <div class="field">
      <label>Email address
        <input type="email" data-bid="b411" aria-label="Email address" placeholder="you@example.com" autocomplete="email" required>
      </label>
    </div>
    <div class="field">
      <label>Phone number <span class="hint">(optional, for pickup alerts)</span>
        <input type="tel" data-bid="b412" aria-label="Phone number (optional)" placeholder="+1 503 555 0100">
      </label>
    </div>
    <div class="field">
      <label>Digest frequency
        <select data-bid="b413" aria-label="Digest frequency">
          <option value="" selected>Choose…</option>
          <option>Daily digest</option>
          <option>Weekly digest</option>
          <option>Monthly roundup</option>
        </select>
      </label>
    </div>
    <div class="field">
      <label>Include print magazine
        <select data-bid="b414" aria-label="Include print magazine">
          <option selected>No</option>
          <option>Yes</option>
        </select>
      </label>
    </div>
    <button type="submit" class="btn" data-bid="b415">Subscribe</button>
    <div id="saved-note" hidden class="note">Preferences saved. Check your inbox for a confirmation link.</div>
  </form>
</main>
<footer>
  <a href="index.html" data-bid="b430">Shipping Policy</a>
  <a href="index.html" data-bid="b431">Privacy Policy</a>
  <span>© 2026 Aurora Books, Portland OR</span>
</footer>
</body>
</html>
