[project]
name = "rewire"
version = "0.1.0"
description = "Rewire — a decision/read-and-route layer over one frozen LLM (DECIDE / GATE / THINK)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["llm", "inference", "logits", "decision-layer", "llm-agents"]
dependencies = [
    "torch>=2.7",
    "transformers>=4.51",
    "accelerate",
    "numpy",
    "pydantic>=2",
    "pyyaml",
    "pytest",
]

[project.optional-dependencies]
train = ["peft", "bitsandbytes"]
serve = ["vllm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
